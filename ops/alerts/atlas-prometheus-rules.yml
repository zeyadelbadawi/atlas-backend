# Atlas — Prometheus alerting rules (P64 Phase 4 §U).
#
# Every expression references only series emitted by
# `src/observability/metrics/learning-metrics.service.ts`; the spec
# `src/observability/metrics/alert-rules.spec.ts` fails the build if a rule
# names a series that does not exist there, so this file cannot drift from
# the code. Labels here carry ids and enum values only — never PII.
#
# Receiver wiring (Alertmanager routes/receivers) is an infrastructure action
# on the production host and is documented in ./README.md; it is not part of
# the application deploy.
groups:
  - name: atlas-commerce
    rules:
      - alert: AtlasCheckoutApprovalBacklog
        expr: |
          sum(increase(atlas_checkout_orders_total{state="pending_payment"}[24h]))
            - sum(increase(atlas_checkout_orders_total{state="paid"}[24h])) > 20
        for: 1h
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "> 20 more orders entered pending_payment than were paid in 24h, for 1h"
          current_value: '{{ $value | humanize }}'
          summary: "Course orders are entering payment review faster than they are approved"
          description: "Over the last 24h, {{ $value }} more orders reached pending_payment than were approved. Check the platform payment review queue."
      - alert: AtlasCheckoutApprovalSlow
        expr: |
          histogram_quantile(0.95, sum(rate(atlas_checkout_approval_latency_seconds_bucket[6h])) by (le)) > 172800
        for: 30m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "p95 proof-to-approval > 48h (172800 s), for 30m"
          current_value: '{{ $value | humanize }}'
          summary: "p95 proof-to-approval latency above 48h"
          description: "Learners are waiting more than two days for manual payment review (p95 = {{ $value | humanizeDuration }})."
      - alert: AtlasCheckoutRefundSpike
        expr: |
          sum(increase(atlas_checkout_orders_total{state="refunded"}[24h])) > 5
            and sum(increase(atlas_checkout_orders_total{state="refunded"}[24h]))
                / clamp_min(sum(increase(atlas_checkout_orders_total{state="paid"}[24h])), 1) > 0.25
        for: 15m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "> 5 refunds and refunds/paid > 25% over 24h, for 15m"
          current_value: '{{ $value | humanize }}'
          summary: "Refunds exceed 25% of paid orders over 24h"

  - name: atlas-catalog
    rules:
      - alert: AtlasPublicCatalogSlow
        expr: |
          histogram_quantile(0.95, sum(rate(atlas_public_catalog_query_duration_ms_bucket[10m])) by (le)) > 1000
        for: 10m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "p95 catalog query > 1000 ms, for 10m"
          current_value: '{{ $value | humanize }}'
          summary: "Public catalog p95 query time above 1s"
          description: "The public course list is slow (p95 = {{ $value }} ms). Check the courses indexes and the FTS filters."

  - name: atlas-retention
    rules:
      - alert: AtlasRetentionSweepFailing
        expr: |
          sum(increase(atlas_retention_sweep_runs_total{result="error"}[24h])) by (table) > 0
        for: 5m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "any retention sweep error in 24h, for 5m"
          current_value: '{{ $value | humanize }}'
          summary: "Retention sweep reported errors for {{ $labels.table }}"
          description: "The maintenance sweep failed to prune {{ $labels.table }} in the last 24h. Check the worker logs (a missing platform owner or a DB error)."
      - alert: AtlasRetentionSweepSilent
        expr: |
          sum(increase(atlas_retention_sweep_runs_total[48h])) by (table) == 0
        for: 1h
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "no successful sweep run in the window, for 1h"
          current_value: '{{ $value | humanize }}'
          summary: "No retention sweep run recorded for {{ $labels.table }} in 48h"
          description: "The Phase 2 maintenance job may not be scheduled or the worker is down."

  - name: atlas-learning
    rules:
      - alert: AtlasGrantRefusalSurge
        expr: |
          sum(rate(atlas_content_grants_total{result="refused"}[15m]))
            / clamp_min(sum(rate(atlas_content_grants_total[15m])), 0.001) > 0.3
        for: 15m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "refusals > 30% of content-grant requests (15m), for 15m"
          current_value: '{{ $value | humanize }}'
          summary: "More than 30% of protected-content grant requests are being refused"
          description: "Could be a sharing wave (device limits / session conflicts) or a token-signing problem. Break down by kind and tier."
      - alert: AtlasVideoWebhookSignatureFailures
        expr: |
          increase(atlas_video_webhook_signature_failures_total[10m]) > 0
        for: 0m
        labels: { severity: critical, team: atlas }
        annotations:
          threshold: "any signature failure in 10m"
          current_value: '{{ $value | humanize }}'
          summary: "Video provider webhook signature failures"
          description: "Requests to the video webhook failed HMAC verification — possible misconfiguration or a forged caller."
      - alert: AtlasQuizIntegrityEventSurge
        expr: |
          sum(rate(atlas_quiz_integrity_events_total[30m])) > 5 * sum(rate(atlas_quiz_integrity_events_total[6h] offset 1d))
            and sum(rate(atlas_quiz_integrity_events_total[30m])) > 0.5
        for: 30m
        labels: { severity: info, team: atlas }
        annotations:
          threshold: "30m rate > 5x the same window yesterday and > 0.5/s, for 30m"
          current_value: '{{ $value | humanize }}'
          summary: "Quiz integrity events are 5x above the daily baseline"
      - alert: AtlasCertificateRenderFailures
        expr: |
          sum(increase(atlas_certificate_renders_total{result="error"}[1h])) > 3
        for: 10m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "> 3 render errors in 1h, for 10m"
          current_value: '{{ $value | humanize }}'
          summary: "Certificate PDF renders are failing"

  # P64 Communications — series emitted by
  # `src/communications/services/communication-metrics.service.ts`.
  - name: atlas-communications
    rules:
      - alert: AtlasEmailQuotaHigh
        expr: |
          max(atlas_comm_quota_used_ratio) by (provider, window) > 0.8
        for: 10m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "provider quota used > 80%, for 10m"
          current_value: '{{ $value | humanize }}'
          summary: "Email provider {{ $labels.provider }} has used over 80% of its {{ $labels.window }} quota"
          description: "{{ $labels.provider }} is at {{ $value | humanizePercentage }} of its {{ $labels.window }} send budget. Engagement/operational mail stops at 70%, lifecycle at 85%; only security/transactional mail continues past that."
      - alert: AtlasEmailQuotaCritical
        expr: |
          max(atlas_comm_quota_used_ratio) by (provider, window) > 0.95
        for: 5m
        labels: { severity: critical, team: atlas }
        annotations:
          threshold: "provider quota used > 95%, for 5m"
          current_value: '{{ $value | humanize }}'
          summary: "Email provider {{ $labels.provider }} is about to exhaust its {{ $labels.window }} quota"
          description: "{{ $labels.provider }} is at {{ $value | humanizePercentage }} of its {{ $labels.window }} budget; the registry will fall through to the next provider, and security email fails once every provider is exhausted."
      - alert: AtlasEmailBounceRate
        expr: |
          sum(increase(atlas_comm_email_delivery_events_total{event=~"bounced|soft_bounced"}[24h]))
            / clamp_min(sum(increase(atlas_comm_email_sends_total{result="sent"}[24h])), 1) > 0.02
        for: 30m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "bounces > 2% of sent (24h), for 30m"
          current_value: '{{ $value | humanize }}'
          summary: "Email bounce rate above 2% over 24h"
          description: "{{ $value | humanizePercentage }} of accepted sends bounced in the last 24h. Free-tier providers suspend senders around this level — check the suppression list and the recipient sources."
      # The one that separates a dead pipeline from a quiet week. Zero
      # throughput looks identical in both cases; the age of the oldest
      # DUE message is the only thing that tells them apart, which is why
      # the sweep publishes it as a gauge rather than relying on counters.
      - alert: AtlasEmailDispatcherStalled
        expr: |
          atlas_comm_outbox_oldest_pending_seconds > 900
        for: 5m
        labels: { severity: critical, team: atlas }
        annotations:
          threshold: "oldest due outbox row > 900 s, for 5m"
          current_value: '{{ $value | humanize }}'
          summary: "Email is queued but nothing is sending it"
          description: "The oldest due message has been waiting {{ $value | humanizeDuration }} and no worker has claimed it. The dispatch sweep runs every 60s, so anything past 15m means the communications worker is not draining the queue — password resets and OTP codes are being accepted and not delivered. Check the worker, then Redis."
      # A dead letter is an email that exhausted every retry: somebody was
      # told something and never received it. Rare enough that any of them
      # is worth a look, so this fires on one.
      - alert: AtlasEmailDeadLetters
        expr: |
          sum(increase(atlas_comm_dead_letter_total[1h])) by (category) > 0
        for: 5m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "any dead letter in 1h, for 5m"
          current_value: '{{ $value | humanize }}'
          summary: "{{ $labels.category }} email gave up after all retries"
          description: "{{ $value }} {{ $labels.category }} message(s) exhausted their retries in the last hour and will never be delivered. Check the provider's status and the delivery failures on Analysis › Communications."
      # A surge of failed codes is either an attack on one account or a
      # delivery fault making every legitimate code useless. Both need a
      # person, and the two are distinguished by the bounce/quota alerts.
      - alert: AtlasAuthOtpFailureSurge
        expr: |
          sum(increase(atlas_auth_otp_total{result="failed"}[15m]))
            / clamp_min(sum(increase(atlas_auth_otp_total[15m])), 1) > 0.5
            and sum(increase(atlas_auth_otp_total{result="failed"}[15m])) > 20
        for: 10m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "failed OTP > 50% of attempts and > 20 failures in 15m"
          current_value: '{{ $value | humanize }}'
          summary: "Most sign-in codes are failing verification"
          description: "{{ $value | humanizePercentage }} of OTP verifications failed in 15m, on more than 20 attempts. Either codes are not reaching inboxes (check delivery and the suppression list) or accounts are being guessed at (check the per-account and per-IP budgets)."
      - alert: AtlasEmailWebhookSignatureFailures
        expr: |
          sum(increase(atlas_comm_webhook_signature_failures_total[15m])) by (provider) > 0
        for: 1m
        labels: { severity: warning, team: atlas }
        annotations:
          threshold: "any webhook signature failure in 15m, for 1m"
          current_value: '{{ $value | humanize }}'
          summary: "Email delivery webhooks for {{ $labels.provider }} are failing verification"
          description: "{{ $value }} inbound webhook(s) for {{ $labels.provider }} failed signature/secret verification in 15m. Either the shared secret rotated or something other than the provider is posting to the endpoint."

  # --- Platform health (Observability Center, 26 Sep 2026) -----------------
  # Series from `http-metrics.middleware.ts`, `system-probes.service.ts` and
  # `observability.service.ts`; `up` and `alertmanager_*` are Prometheus'
  # and Alertmanager's own.
  - name: atlas-platform
    rules:
      - alert: AtlasBackendDown
        expr: |
          up{job="atlas-backend"} == 0
        for: 2m
        labels: { severity: critical, team: atlas, service: api }
        annotations:
          summary: "Prometheus cannot scrape the Atlas API"
          description: "The backend has not answered an authenticated /metrics scrape for 2 minutes. The API may be down, or the scrape credential may be wrong."
          threshold: "scrape failing for 2m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasApiHighErrorRate
        expr: |
          sum(rate(atlas_http_requests_total{status_class="5xx"}[5m]))
            / clamp_min(sum(rate(atlas_http_requests_total[5m])), 1e-9) > 0.05
          and sum(rate(atlas_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical, team: atlas, service: api }
        annotations:
          summary: "API 5xx error rate above 5%"
          description: "{{ $value | humanizePercentage }} of API requests answered 5xx over the last 5 minutes."
          threshold: "5xx > 5% of requests (5m), for 5m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasApiHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(atlas_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning, team: atlas, service: api }
        annotations:
          summary: "API p95 latency above 2 s"
          description: "p95 request latency is {{ $value | humanizeDuration }} over the last 5 minutes."
          threshold: "p95 > 2 s, for 10m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasDependencyDown
        expr: |
          atlas_dependency_up == 0
        for: 2m
        labels: { severity: critical, team: atlas, service: infrastructure }
        annotations:
          summary: "{{ $labels.dependency }} is not answering its probe"
          description: "The {{ $labels.dependency }} probe has failed for 2 minutes."
          threshold: "probe failing for 2m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasQueueBacklog
        expr: |
          max by (queue) (atlas_queue_oldest_waiting_seconds) > 900
        for: 10m
        labels: { severity: warning, team: atlas, service: jobs }
        annotations:
          summary: "Queue {{ $labels.queue }} is not draining"
          description: "The oldest waiting job on {{ $labels.queue }} has waited {{ $value | humanizeDuration }}."
          threshold: "oldest waiting job > 15 min, for 10m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasAlertDeliveryFailing
        expr: |
          sum by (integration) (increase(alertmanager_notifications_failed_total[30m])) > 0
        for: 5m
        labels: { severity: warning, team: atlas, service: alerting }
        annotations:
          summary: "Alert notifications to {{ $labels.integration }} are failing"
          description: "Alertmanager failed to deliver {{ $value }} notification(s) in 30m. Check the receiver configuration."
          threshold: "any failed notification in 30m, for 5m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasSyntheticAlert
        expr: |
          max(atlas_synthetic_alert_armed) == 1
        for: 0m
        labels: { severity: warning, team: atlas, service: alerting, synthetic: "true" }
        annotations:
          summary: "Synthetic test alert (armed by a Platform Owner)"
          description: "End-to-end test of Atlas -> Prometheus -> Alertmanager -> Slack. It resolves when the test expires or is resolved from the Observability Center."
          threshold: "armed from Monitoring & alerts"
          current_value: '{{ $value | humanize }}'

  # Launch Stabilization A1 — the real academy website never calls a
  # management/Platform Owner route or another academy's learner route, so
  # any refusal means a token is being used outside the website it was
  # issued to (e.g. a token lifted from a tenant-operated origin). The
  # structured `auth.surface.denied` log line carries user, session and
  # route pattern for triage.
  - name: atlas-security
    rules:
      # Google Identity (docs/GOOGLE_IDENTITY.md), series from
      # `google-auth-metrics.ts`. Password sign-in never depends on Google,
      # so these are warnings: Google sign-in is degraded, nothing else.
      - alert: AtlasGoogleSignInProviderErrors
        expr: |
          sum(increase(atlas_google_auth_total{stage="callback",result="provider_error"}[15m])) > 5
        for: 5m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "Google sign-in callbacks are failing at Google's end"
          description: "{{ $value }} Google callback(s) in 15m could not exchange the code or fetch Google's signing keys. Most often the OAuth client secret was rotated in Google Cloud but not in the GOOGLE_OAUTH_CLIENT_SECRET secret, or Google is unreachable. Password sign-in is unaffected; set FLAG_AUTH_GOOGLE_MODE=off to hide the button while fixing."
          threshold: "> 5 provider errors in 15m, for 5m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasGoogleInvalidIdTokens
        expr: |
          sum(increase(atlas_google_auth_total{result="invalid_token"}[15m])) > 0
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "A Google ID token failed verification"
          description: "{{ $value }} Google ID token(s) in 15m failed signature, issuer, audience, expiry or nonce checks. Nothing was signed in. A client-id mismatch (GOOGLE_OAUTH_CLIENT_ID) or a forged callback; search logs for 'Google sign-in callback failed.' (reason only, never the token)."
          threshold: "any invalid ID token in 15m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasGoogleInvalidFlowSurge
        expr: |
          sum(increase(atlas_google_auth_total{result="invalid_state"}[15m])) > 20
        for: 5m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "Many Google sign-ins presented an unknown, replayed or foreign flow"
          description: "{{ $value }} Google callbacks/completions in 15m carried a state or handoff that was unknown, expired, replayed, or presented from another browser or origin. Either a broken return path (proxy/host change) or replay attempts; no session is issued for any of them."
          threshold: "> 20 in 15m, for 5m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasSessionSurfaceDenied
        expr: |
          sum by (reason) (increase(atlas_auth_surface_denied_total[15m])) > 0
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "A session was used outside the website it was issued to ({{ $labels.reason }})"
          description: "{{ $value }} request(s) in 15m were refused because the session was minted for another surface or academy. Search the logs for event=auth.surface.denied to see the user, session and route."
          threshold: "any refusal in 15m"
          current_value: '{{ $value | humanize }}'
      # Production-readiness pass — authentication abuse, from the ONE
      # central refusal counter (the global exception filter records every
      # errors.auth.* refusal by key) and the session-revocation counter.
      - alert: AtlasAuthBruteForce
        expr: |
          sum(increase(atlas_auth_refusals_total{key=~"invalidCredentials|rateLimited"}[10m])) > 50
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "Password sign-in refusals are surging (possible brute force / credential stuffing)"
          description: "{{ $value }} sign-ins in 10m were refused as invalid credentials or rate-limited. Per-IP and per-account limits are holding; check the Request failed warn logs for the source IPs and whether one account or many are targeted."
          threshold: "> 50 in 10m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasAuthRefreshTokenReuse
        expr: |
          sum(increase(atlas_auth_sessions_revoked_total{trigger="refresh_token_reuse"}[30m])) > 0
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "A rotated refresh token was replayed and its session ended (possible session theft)"
          description: "{{ $value }} session famil(ies) in 30m were ended because a refresh token that had already been rotated was presented again after the multi-tab grace. Search the logs for event=auth.refresh.reuse_detected for the user; the audit log carries auth.sessions.revoked with trigger refresh_token_reuse."
          threshold: "any in 30m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasAuthCrossOriginSession
        expr: |
          sum(increase(atlas_auth_refusals_total{key="crossOriginSession"}[15m])) > 10
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "Session-cookie requests are arriving from foreign origins (possible CSRF attempts)"
          description: "{{ $value }} refresh/sign-out requests in 15m carried the session cookie but an Origin other than the host's own; all were refused. A few can be a stale tab after a host move; a surge is someone framing or scripting against Atlas hosts."
          threshold: "> 10 in 15m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasAuthSecondFactorGuessing
        expr: |
          sum(increase(atlas_auth_refusals_total{key=~"invalidTwoFactorCode|otpInvalid|otpAttemptsExceeded"}[15m])) > 25
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "Many wrong second-factor codes (TOTP / emailed code)"
          description: "{{ $value }} TOTP or emailed-code attempts in 15m were wrong. Each challenge locks after its attempt limit; a surge means someone holds passwords and is guessing the second factor."
          threshold: "> 25 in 15m"
          current_value: '{{ $value | humanize }}'
      - alert: AtlasAuthResetLinkAbuse
        expr: |
          sum(increase(atlas_auth_refusals_total{key=~"invalidResetToken|invalidVerificationToken"}[30m])) > 20
        for: 0m
        labels: { severity: warning, team: atlas, service: auth }
        annotations:
          summary: "Many invalid password-reset / verification links"
          description: "{{ $value }} reset or verification tokens in 30m were unknown, spent or expired. Real users hit this occasionally (an old email); a surge is token guessing or link replay."
          threshold: "> 20 in 30m"
          current_value: '{{ $value | humanize }}'

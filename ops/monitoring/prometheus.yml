# Atlas — internal Prometheus (alert routing, 26 Sep 2026).
#
# Runs on the compose network only (no published port). Scrapes the
# backend's `/metrics` with the dedicated scrape credential, read from a
# host-provided file — never from this file, never from the image.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/atlas-prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: atlas-backend
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_scrape_token
    static_configs:
      - targets: ['backend:3000']

# Atlas — Alertmanager → Slack (alert routing, 26 Sep 2026).
#
# The Slack incoming-webhook URL is a secret: it is read from a
# host-provided file (`api_url_file`), never written here.
route:
  receiver: atlas-slack
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: atlas-slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

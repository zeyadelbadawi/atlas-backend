# Atlas Backend — local development infrastructure.
#
# Provides the stateful dependencies the backend needs locally: PostgreSQL
# (primary database, ADR-002), Redis (cache/queue broker foundation,
# ADR-004), and MinIO (Phase P8 — a real, local, S3-compatible object
# store standing in for Cloudflare R2, ADR-005; R2 is S3-compatible, so
# `R2StorageProvider` speaks the exact same protocol against either —
# only the endpoint/credentials differ between environments, matching how
# `DATABASE_URL` already points at local Postgres here and a managed
# instance in production, same Prisma client code either way). Nothing
# here represents production infrastructure — see
# Reports/ATLAS_BACKEND_MASTER_PLAN.md §20 for the real deployment
# architecture (managed Postgres/Redis, real Cloudflare R2, no self-hosted
# containers in staging/production).
name: atlas-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas_dev
    ports:
      - '5432:5432'
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas_media_dev
      MINIO_ROOT_PASSWORD: atlas_media_dev_password
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - atlas_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas_postgres_data:
  atlas_redis_data:
  atlas_minio_data:

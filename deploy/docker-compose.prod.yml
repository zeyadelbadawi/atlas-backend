# Atlas production stack — single Oracle Cloud VPS (Phase 7, confirmed
# architecture). Canonical copy lives here for version history; the
# deployed copy on the VPS itself is at /opt/atlas/docker-compose.yml.
#
# postgres/redis deliberately have no `ports:` mapping at all — not even
# to 127.0.0.1 — so they are unreachable from outside this compose
# network under any circumstance. Only caddy publishes to the host
# (80/443); backend is reached exclusively via Caddy's internal
# reverse_proxy over the compose network.
name: atlas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/zeyadelbadawi/atlas-backend:latest
    restart: unless-stopped
    env_file: .env
    # Observability Center: set by deploy.sh only when the monitoring profile
    # is enabled; empty otherwise (the backend then reports "not configured").
    environment:
      PROMETHEUS_URL: ${OBS_PROMETHEUS_URL:-}
      ALERTMANAGER_URL: ${OBS_ALERTMANAGER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: ghcr.io/zeyadelbadawi/atlas-frontend:latest
    restart: unless-stopped
    # Docker's init (tini) as PID 1, so orphaned processes are reaped. Without
    # it every healthcheck left a zombie: BusyBox wget forks an ssl_client
    # helper for https://, the helper is re-parented to PID 1, and Caddy
    # never waits on children it did not start (12,196 zombies under
    # atlas-caddy-1 on 1 Oct 2026, one per 15 s healthcheck). tini forwards
    # SIGTERM to Caddy, so shutdown is unchanged.
    init: true
    # Least privilege: the edge needs exactly ONE secret — the Cloudflare
    # token the Caddyfile's DNS-01 challenge reads as
    # `{env.CLOUDFLARE_API_TOKEN}` (the only `{env.*}` it references). It
    # used to take `env_file: .env`, which handed the edge container the
    # superuser DATABASE_URL, JWT signing secret, payment keys and every
    # other backend secret. Interpolated from `.env` by compose itself (the
    # same mechanism the postgres/redis blocks use), so nothing else in
    # that file reaches this container's environment.
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Phase 8 — server-rendered public Academy pages. `on` routes Academy
      # page requests to the `ssr` service below; anything else (the
      # default) keeps every request on the route it took before.
      ATLAS_SSR: ${ATLAS_SSR:-off}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # P63g — a broken Caddyfile, a failed certificate load or a bad SPA
    # build used to produce a green deploy (only the backend was checked).
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '--no-check-certificate', 'https://localhost/']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- Public website server renderer (Phase 8) ----------------------------
  # Renders the anonymous public Academy pages for Caddy (frontend repo:
  # Reports/SSR_ARCHITECTURE_ANALYSIS.md). Profile-gated: `deploy.sh`
  # enables the `ssr` profile only when ATLAS_SSR=on in .env, the same
  # switch Caddy reads.
  #   * No published port and no env_file: it holds no secret at all. It
  #     calls only the public website API, anonymously, over the compose
  #     network, and forwards no cookie or credential.
  #   * Caddy does NOT depend on it: if it is stopped, slow or failing,
  #     Caddy serves the single-page app exactly as before.
  #   * Bounded memory. Pages over the HTML budget (1 MiB; frontend
  #     server/ssr/handler.mjs) pass to the single-page app before they are
  #     rendered, and the page cache is capped at 64 MiB of heap. Measured
  #     with the frontend's tools/ssr-memory/measure.mjs (node:20-alpine,
  #     720 distinct pages, inline-logo and oversized Academies): peak
  #     185 MiB at 16 concurrent requests, 213 MiB at 64. The limit is about
  #     twice the measured peak; V8's old space is capped below it so the
  #     heap is collected before the kernel would kill the process. If it
  #     is ever exceeded, the container restarts and Caddy serves the
  #     single-page app meanwhile.
  #   * init: true — tini as PID 1 reaps orphaned processes (see caddy) and
  #     forwards SIGTERM to the server, which closes gracefully.
  ssr:
    image: ghcr.io/zeyadelbadawi/atlas-frontend-ssr:latest
    profiles: ['ssr']
    restart: unless-stopped
    read_only: true
    init: true
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      SSR_API_ORIGIN: http://backend:3000
      NODE_OPTIONS: --max-old-space-size=256
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3100/__ssr/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # --- Observability Center ----------------------------------------------
  # Profile-gated: `deploy.sh` enables `monitoring` whenever METRICS_SCRAPE_TOKEN
  # exists (it generates one on the host if missing) and adds the Slack
  # receiver only when ALERT_SLACK_WEBHOOK_URL is set. Secret values are
  # written to files under /opt/atlas/monitoring/secrets (dir 0700).
  # Secrets are bind-mounted as files and read via `credentials_file` /
  # `api_url_file`; neither appears in any config, image or environment.
  # No published ports: both are reachable on the compose network only.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/atlas-prometheus-rules.yml:/etc/prometheus/rules/atlas-prometheus-rules.yml:ro
      - ./monitoring/secrets/metrics_scrape_token:/etc/prometheus/secrets/metrics_scrape_token:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets/slack_webhook_url:/etc/alertmanager/secrets/slack_webhook_url:ro
      - alertmanager_data:/alertmanager

volumes:
  atlas_postgres_data:
  atlas_redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:

# Atlas production stack — single Oracle Cloud VPS (Phase 7, confirmed
# architecture). Canonical copy lives here for version history; the
# deployed copy on the VPS itself is at /opt/atlas/docker-compose.yml.
#
# postgres/redis deliberately have no `ports:` mapping at all — not even
# to 127.0.0.1 — so they are unreachable from outside this compose
# network under any circumstance. Only caddy publishes to the host
# (80/443); backend is reached exclusively via Caddy's internal
# reverse_proxy over the compose network.
name: atlas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/zeyadelbadawi/atlas-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: ghcr.io/zeyadelbadawi/atlas-frontend:latest
    restart: unless-stopped
    # Least privilege: the edge needs exactly ONE secret — the Cloudflare
    # token the Caddyfile's DNS-01 challenge reads as
    # `{env.CLOUDFLARE_API_TOKEN}` (the only `{env.*}` it references). It
    # used to take `env_file: .env`, which handed the edge container the
    # superuser DATABASE_URL, JWT signing secret, payment keys and every
    # other backend secret. Interpolated from `.env` by compose itself (the
    # same mechanism the postgres/redis blocks use), so nothing else in
    # that file reaches this container's environment.
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # P63g — a broken Caddyfile, a failed certificate load or a bad SPA
    # build used to produce a green deploy (only the backend was checked).
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '--no-check-certificate', 'https://localhost/']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- Alert routing (26 Sep 2026) ---------------------------------------
  # Profile-gated: `deploy.sh` enables `monitoring` ONLY when the host .env
  # carries both METRICS_SCRAPE_TOKEN and ALERT_SLACK_WEBHOOK_URL, and
  # writes each to a file under /opt/atlas/monitoring/secrets (dir 0700).
  # Secrets are bind-mounted as files and read via `credentials_file` /
  # `api_url_file`; neither appears in any config, image or environment.
  # No published ports: both are reachable on the compose network only.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/atlas-prometheus-rules.yml:/etc/prometheus/rules/atlas-prometheus-rules.yml:ro
      - ./monitoring/secrets/metrics_scrape_token:/etc/prometheus/secrets/metrics_scrape_token:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets/slack_webhook_url:/etc/alertmanager/secrets/slack_webhook_url:ro
      - alertmanager_data:/alertmanager

volumes:
  atlas_postgres_data:
  atlas_redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:

name: Launch verify

# Launch Stabilization Plan A + A6 — production smoke verification
# (docs/ATLAS_LAUNCH_STABILIZATION_PLAN.md §16), plus the smart member
# invitation / academy join (docs/SMART_MEMBER_INVITE_AND_ACADEMY_JOIN.md).
# Dispatch only. Every job on its own runner (separate IPs) so the per-IP
# sign-in budget is never the thing being measured. Test accounts are
# plus-addresses of the owner's own mailbox; nothing is deleted, no academy or
# organization is created.
# Sign-in codes are read by deploy/launch-verify/remote.sh and never logged.

on:
  workflow_dispatch:
    inputs:
      mailbox:
        description: >-
          Gmail local part of a mailbox the owner controls. Test addresses are
          its plus-addresses (<local>+atlas-lsv-<run>-<tag>@gmail.com).
        required: true
        type: string
      scope:
        description: all = every journey + deliverability; deliverability = the read-only email facts only
        required: false
        default: all
        type: choice
        options: [all, deliverability]

concurrency:
  group: launch-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    if: inputs.scope != 'deliverability'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Public repository, public logs: mask the mailbox before any step
      # prints its env (read from the event payload, never a step header).
      - name: Mask the inputs
        run: |
          v=$(jq -r '.inputs.mailbox // empty' "$GITHUB_EVENT_PATH")
          [ -n "$v" ] && echo "::add-mask::$v"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare the deploy identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: API verification (A1–A6, observability)
        working-directory: deploy/launch-verify
        env:
          MODE: api
          MAILBOX: ${{ inputs.mailbox }}
          RUN_TAG: ${{ github.run_id }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY_FILE: /home/runner/.ssh/deploy_key
        run: node verify.mjs

  browser:
    if: inputs.scope != 'deliverability'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUT: ${{ github.workspace }}/launch-verify-out
    steps:
      # Public repository, public logs: mask the mailbox before any step
      # prints its env (read from the event payload, never a step header).
      - name: Mask the inputs
        run: |
          v=$(jq -r '.inputs.mailbox // empty' "$GITHUB_EVENT_PATH")
          [ -n "$v" ] && echo "::add-mask::$v"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright (Chromium)
        working-directory: deploy/launch-verify
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare the deploy identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Browser verification (management + academy sign-in with the email code)
        working-directory: deploy/launch-verify
        env:
          MODE: browser
          MAILBOX: ${{ inputs.mailbox }}
          RUN_TAG: ${{ github.run_id }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY_FILE: /home/runner/.ssh/deploy_key
        run: node verify.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-verify-screenshots
          path: launch-verify-out
          retention-days: 14

  smi:
    if: inputs.scope != 'deliverability'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Public repository, public logs: mask the mailbox before any step
      # prints its env (read from the event payload, never a step header).
      - name: Mask the inputs
        run: |
          v=$(jq -r '.inputs.mailbox // empty' "$GITHUB_EVENT_PATH")
          [ -n "$v" ] && echo "::add-mask::$v"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare the deploy identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Smart academy join + member lookup (API)
        working-directory: deploy/launch-verify
        env:
          MODE: smi
          MAILBOX: ${{ inputs.mailbox }}
          RUN_TAG: ${{ github.run_id }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY_FILE: /home/runner/.ssh/deploy_key
        run: node verify.mjs

  smi-browser:
    if: inputs.scope != 'deliverability'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OUT: ${{ github.workspace }}/launch-verify-out
    steps:
      # Public repository, public logs: mask the mailbox before any step
      # prints its env (read from the event payload, never a step header).
      - name: Mask the inputs
        run: |
          v=$(jq -r '.inputs.mailbox // empty' "$GITHUB_EVENT_PATH")
          [ -n "$v" ] && echo "::add-mask::$v"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright (Chromium)
        working-directory: deploy/launch-verify
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare the deploy identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Smart academy join (browser, EN desktop + AR mobile)
        working-directory: deploy/launch-verify
        env:
          MODE: smi-browser
          MAILBOX: ${{ inputs.mailbox }}
          RUN_TAG: ${{ github.run_id }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY_FILE: /home/runner/.ssh/deploy_key
        run: node verify.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-verify-smi-screenshots
          path: launch-verify-out
          retention-days: 14

  deliverability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Public repository, public logs: mask the mailbox before any step
      # prints its env (read from the event payload, never a step header).
      - name: Mask the inputs
        run: |
          v=$(jq -r '.inputs.mailbox // empty' "$GITHUB_EVENT_PATH")
          [ -n "$v" ] && echo "::add-mask::$v"
          true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare the deploy identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Email deliverability facts (DNS, Brevo; read-only)
        working-directory: deploy/launch-verify
        env:
          MODE: deliverability
          MAILBOX: ${{ inputs.mailbox }}
          RUN_TAG: ${{ github.run_id }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY_FILE: /home/runner/.ssh/deploy_key
        run: node verify.mjs

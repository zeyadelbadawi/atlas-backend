name: Origin exposure check

# B0-OPS-04 — is the origin server reachable without going through
# Cloudflare? Read-only. From a GitHub runner (outside Cloudflare) it
# requests the site through Cloudflare, then directly at the origin
# (DEPLOY_HOST, the same address the deploy SSHes to) on 80 and 443, with
# the platform Host header and with a host no academy owns (the
# custom-domain catch-all).
#
# Two layers, reported separately:
#   - application lock (frontend Caddyfile `(origin_lock)`): Caddy drops a
#     connection whose peer is not a Cloudflare edge address before any
#     route runs, so a direct request gets no response at all (curl exit
#     52 / 56 / 92). The port still accepts TCP.
#   - network lock (owner action: Oracle security list allows 80/443 from
#     Cloudflare's ranges only): a direct connection is refused or times
#     out (curl exit 7 / 28).
# The job fails only when the origin SERVES a direct request (a response
# with a status line): that is the bypass OPS-04 forbids.
#
# The origin address is a secret and is never printed (GitHub masks it, and
# the log shows outcomes only).
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 05:17 UTC: a regression (lock removed, kill switch
    # left off) shows up within a week.
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE: atlass.dpdns.org
      # Reserved TLD (RFC 2606): no academy can own it, so it reaches the
      # `:443` / `:80` catch-all blocks.
      STRAY_HOST: origin-check.invalid
    steps:
      - name: Probe
        env:
          ORIGIN: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -uo pipefail
          served=0 open=0
          probe() { # $1 label, then curl args; prints the outcome only
            local label="$1"; shift
            local out code connect rc
            out=$(curl -sS -o /dev/null -w '%{http_code} %{time_connect}' --connect-timeout 8 --max-time 15 "$@" 2>/dev/null); rc=$?
            code=${out%% *}; connect=${out##* }
            # A status line means the origin answered, whatever went wrong after it.
            if [ "${code:-000}" != 000 ]; then echo "$label: SERVED (HTTP $code)"; return 0; fi
            case "$rc" in
              7) echo "$label: refused (connection refused: network lock)";;
              28)
                # time_connect stays 0 unless the TCP handshake completed.
                if [ "${connect:-0}" = 0 ] || [ "${connect:-0}" = 0.000000 ]; then
                  echo "$label: timed out before connecting (network lock)"
                else
                  echo "$label: connected, no response before the timeout (port open)"; open=1
                fi;;
              52|56|92) echo "$label: dropped without a response (application lock; port open)"; open=1;;
              35|60) echo "$label: TLS handshake answered but failed (port open)"; open=1;;
              *) echo "$label: not reachable (curl exit $rc)";;
            esac
            return 1
          }
          # DEPLOY_HOST may be a name or an address; --resolve needs an address.
          IP=$(getent ahostsv4 "$ORIGIN" | awk 'NR == 1 { print $1 }')
          [ -n "$IP" ] || { echo "::error::cannot resolve the origin address"; exit 1; }
          echo "::add-mask::$IP"
          echo "== Through Cloudflare"
          if ! probe "https://$SITE/" "https://$SITE/"; then
            echo "::error::the site does not answer through Cloudflare"
            exit 1
          fi
          echo "== Directly at the origin (bypassing Cloudflare)"
          probe "origin :443 (Host: $SITE)" -k --resolve "$SITE:443:$IP" "https://$SITE/" && served=1
          probe "origin :80 (Host: $SITE)" --resolve "$SITE:80:$IP" "http://$SITE/" && served=1
          probe "origin :443 (Host: $STRAY_HOST)" -k --resolve "$STRAY_HOST:443:$IP" "https://$STRAY_HOST/" && served=1
          probe "origin :80 (Host: $STRAY_HOST)" --resolve "$STRAY_HOST:80:$IP" "http://$STRAY_HOST/" && served=1
          if [ "$served" = 1 ]; then
            echo "RESULT: the origin serves direct requests; Cloudflare can be bypassed (OPS-04 NOT met)"
            echo "::error::origin served a request that bypassed Cloudflare"
            exit 1
          elif [ "$open" = 1 ]; then
            echo "RESULT: application lock holds (no direct request is served); ports 80/443 still accept connections from outside Cloudflare (network lock pending)"
          else
            echo "RESULT: network lock holds (the origin does not accept direct connections on 80/443 from this runner); the application lock is not observable from here because no probe reached Caddy"
          fi

name: Deploy

# Phase 7. Builds the production image for linux/arm64 (the Oracle VPS is
# an Ampere/ARM instance — cross-built via QEMU since GitHub's runners
# are x86_64), pushes it to GHCR, then SSHes into the VPS as the
# restricted `deploy` user (never a personal key, never root) to pull
# and roll out.
#
# Triggers directly on push to `main`, NOT gated on `ci.yml` succeeding.
# `ci.yml`'s Lint step has been failing on `main` since before Phase 7
# (624 pre-existing prettier violations across test files, confirmed via
# `git stash` against unmodified `main` — unrelated to this phase, out of
# scope to mass-reformat here). Gating deploy on that CI run would mean
# deploy never fires at all today. Flagged separately for the repo owner
# to fix (either `prettier --write` + commit, or scope the lint script
# away from `test/`) — once fixed, switch this back to
# `workflow_run: {workflows: [CI], types: [completed]}` with
# `if: github.event.workflow_run.conclusion == 'success'` so deploy is
# properly gated on tests passing again.
# P64 Phase 1 — production migrations are gated behind TWO independent
# conditions, because the Phase 1 migration rewrites learner-visible data
# (it renumbers quiz attempt numbers and closes stale in-progress attempts)
# and `deploy.sh --rollback` re-pins images without reverting a migration.
#
#   1. INTENT:   this workflow must be dispatched by hand with
#                `apply_migrations=true`. A push never sets it.
#   2. APPROVAL: that input routes the run through the `production-migrations`
#                job below, which names a protected environment and therefore
#                cannot start until a required reviewer approves it.
#
# Either condition missing means `deploy.sh` is invoked WITHOUT
# `--with-migrations`, and it then aborts before touching the schema if any
# migration is pending. A push that carries no migration is unaffected.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: >-
          Apply pending database migrations. Requires approval of the
          protected `production-migrations` environment. Leave false to
          deploy application code only.
        type: boolean
        default: false

# P63g — one deploy at a time against the single VPS (see the frontend
# workflow for the cross-repo `flock` in deploy.sh).
concurrency:
  group: atlas-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Condition 2 of the migration gate. It runs ONLY when a human dispatched
  # this workflow asking for migrations, and it does no work of its own: its
  # entire purpose is to name a protected environment, so GitHub holds the
  # run until a required reviewer approves. `build-and-deploy` waits on the
  # result. On a push this job is skipped, which the dependent job allows.
  #
  # PREREQUISITE, and the gate is inert without it: the repository must have
  # an environment named `production-migrations` with at least one required
  # reviewer configured. Naming an environment here does not by itself
  # require approval — the protection rule does.
  approve-migrations:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - name: Record the approval
        run: |
          echo "Production migrations approved by ${{ github.actor }}"
          echo "Run: ${{ github.run_id }} — commit ${{ github.sha }}"

  build-and-deploy:
    needs: [approve-migrations]
    # `always()` so a push (where the gate job is SKIPPED) still deploys,
    # while a REJECTED or failed approval stops the deploy entirely.
    if: >-
      always() &&
      (needs.approve-migrations.result == 'success' ||
       needs.approve-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlas-backend:latest
            ghcr.io/${{ github.repository_owner }}/atlas-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The four Zoom production variables, from GitHub Secrets. Unset
          # secrets arrive as empty strings and are filtered out below, so
          # this step is a safe no-op until the secrets are populated.
          ZOOM_OAUTH_CLIENT_ID: ${{ secrets.ZOOM_OAUTH_CLIENT_ID }}
          ZOOM_OAUTH_CLIENT_SECRET: ${{ secrets.ZOOM_OAUTH_CLIENT_SECRET }}
          ZOOM_OAUTH_REDIRECT_URI: ${{ secrets.ZOOM_OAUTH_REDIRECT_URI }}
          ZOOM_WEBHOOK_SECRET_TOKEN: ${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Build a base64 fragment of ONLY the non-empty Zoom vars. Kept
          # in a variable and piped over ssh stdin — never on the command
          # line (which would show in the VPS process list) and never
          # echoed (base64 of a secret is not auto-masked by Actions).
          FRAGMENT_B64=$(python3 - <<'PYEOF'
          import os, base64
          keys = [
            'ZOOM_OAUTH_CLIENT_ID', 'ZOOM_OAUTH_CLIENT_SECRET',
            'ZOOM_OAUTH_REDIRECT_URI', 'ZOOM_WEBHOOK_SECRET_TOKEN',
          ]
          lines = [f"{k}={os.environ[k]}" for k in keys if os.environ.get(k)]
          print(base64.b64encode("\n".join(lines).encode()).decode() if lines else "")
          PYEOF
          )
          # Deliver the repo's deploy.sh to the VPS so the deploy SCRIPT is
          # version-controlled too — previously /opt/atlas/deploy.sh was
          # hand-placed and drifted from the repo, so changes to
          # deploy/deploy.sh never took effect in production.
          # P63g — the compose file and the backup script are deployed
          # artefacts too (previously only deploy.sh was, so a change to
          # either in this repo never reached production).
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            deploy/deploy.sh \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/atlas/deploy.sh
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            deploy/docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/atlas/docker-compose.yml
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            deploy/backup.sh \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/atlas/backup.sh
          # Condition 1 of the migration gate. The flag is appended ONLY for a
          # dispatch that asked for migrations — and such a run reached this
          # point only by passing the protected-environment approval above.
          # A push always sends the bare `--sync-env`, exactly as before.
          MIGRATE_FLAG=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}" = "true" ]; then
            MIGRATE_FLAG=" --with-migrations"
          fi
          printf '%s' "$FRAGMENT_B64" | ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "bash /opt/atlas/deploy.sh --sync-env${MIGRATE_FLAG}"

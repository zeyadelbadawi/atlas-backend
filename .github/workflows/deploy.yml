name: Deploy

# Phase 7. Builds the production image for linux/arm64 (the Oracle VPS is
# an Ampere/ARM instance — cross-built via QEMU since GitHub's runners
# are x86_64), pushes it to GHCR, then SSHes into the VPS as the
# restricted `deploy` user (never a personal key, never root) to pull
# and roll out.
#
# Runs only after `Backend CI` succeeds for a push to `main`
# (`workflow_run`), and deploys exactly the commit CI tested
# (`workflow_run.head_sha`). A red CI run therefore never reaches
# production. (Until 2 Oct 2026 this triggered on every push, ungated,
# because the old `ci.yml` was red on lint and then disabled; both fixed.)
# A manual dispatch is still possible for migrations — see below — and is
# a deliberate, approved act, not the normal path.
# P64 Phase 1 — production migrations are gated behind TWO independent
# conditions, because the Phase 1 migration rewrites learner-visible data
# (it renumbers quiz attempt numbers and closes stale in-progress attempts)
# and `deploy.sh --rollback` re-pins images without reverting a migration.
#
#   1. INTENT:   this workflow must be dispatched by hand with
#                `apply_migrations=true`. A push never sets it.
#   2. APPROVAL: that input routes the run through the `production-migrations`
#                job below, which names a protected environment and therefore
#                cannot start until a required reviewer approves it.
#
# Either condition missing means `deploy.sh` is invoked WITHOUT
# `--with-migrations`, and it then aborts before touching the schema if any
# migration is pending. A push that carries no migration is unaffected.
on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: >-
          Apply pending database migrations. Requires approval of the
          protected `production-migrations` environment. Leave false to
          deploy application code only.
        type: boolean
        default: false

# P63g — one deploy at a time against the single VPS (see the frontend
# workflow for the cross-repo `flock` in deploy.sh).
concurrency:
  group: atlas-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # 1. BUILD — holds no SSH identity at all, so nothing here can reach the
  #    VPS. Runs for every trigger; both deploy jobs below consume the
  #    image it pushes.
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlas-backend:latest
            ghcr.io/${{ github.repository_owner }}/atlas-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. NORMAL DEPLOYMENT — every green Backend CI run on `main`, and any dispatch that did
  #    not ask for migrations.
  #
  #    It holds `DEPLOY_SSH_KEY`, the NON-MIGRATION identity, and never
  #    passes `--with-migrations`. If the image carries a pending
  #    migration, `deploy.sh` stops before touching the schema and this job
  #    fails — code and schema stay in lockstep rather than drifting.
  #
  #    This job has no access to `MIGRATION_SSH_KEY`: that secret lives on
  #    the `production-migrations` environment, and a job that does not
  #    declare that environment cannot read it. That is the boundary — not
  #    the ordering of jobs.
  deploy:
    needs: [build]
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && !inputs.apply_migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/vps-deploy
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          user: ${{ secrets.DEPLOY_USER }}
          host: ${{ secrets.DEPLOY_HOST }}
          with_migrations: 'false'
          zoom_client_id: ${{ secrets.ZOOM_OAUTH_CLIENT_ID }}
          zoom_client_secret: ${{ secrets.ZOOM_OAUTH_CLIENT_SECRET }}
          zoom_redirect_uri: ${{ secrets.ZOOM_OAUTH_REDIRECT_URI }}
          zoom_webhook_secret_token: ${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
          # Google Identity — secrets; the mode and academies are the
          # FLAG_AUTH_GOOGLE_* variables below.
          google_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          google_redirect_uri: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          # P64 Communications. The provider CHAIN is a repository
          # VARIABLE (it is configuration, not a secret, and the ability
          # to read it is how an operator sees which providers are live);
          # every credential and the sender identity are SECRETS. A
          # provider named in the chain without its key refuses to boot
          # by design — so add `resend` to EMAIL_PROVIDERS only once
          # RESEND_API_KEY exists.
          email_providers: ${{ vars.EMAIL_PROVIDERS }}
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          email_from_email: ${{ secrets.EMAIL_FROM_EMAIL }}
          email_from_name: ${{ vars.EMAIL_FROM_NAME }}
          email_reply_to: ${{ secrets.EMAIL_REPLY_TO }}
          brevo_webhook_secret: ${{ secrets.BREVO_WEBHOOK_SECRET }}
          resend_webhook_secret: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          alert_slack_webhook_url: ${{ secrets.ALERT_SLACK_WEBHOOK_URL }}
          platform_web_url: ${{ vars.PLATFORM_WEB_URL }}
          # Real-user monitoring is on unless the repository variable says
          # otherwise (set RUM_ENABLED=false to switch it off at the next deploy).
          rum_enabled: ${{ vars.RUM_ENABLED || 'true' }}
          # P64 rollout flags come from repository VARIABLES (Settings →
          # Variables), one per line; unset ones are dropped by the action.
          feature_flags: |
            FLAG_QUIZ_ENGINE_V2_MODE=${{ vars.FLAG_QUIZ_ENGINE_V2_MODE }}
            FLAG_QUIZ_ENGINE_V2_ACADEMY_IDS=${{ vars.FLAG_QUIZ_ENGINE_V2_ACADEMY_IDS }}
            FLAG_QUIZ_INTEGRITY_MODE=${{ vars.FLAG_QUIZ_INTEGRITY_MODE }}
            FLAG_QUIZ_INTEGRITY_ACADEMY_IDS=${{ vars.FLAG_QUIZ_INTEGRITY_ACADEMY_IDS }}
            FLAG_CONTENT_PROTECTED_MODE=${{ vars.FLAG_CONTENT_PROTECTED_MODE }}
            FLAG_CONTENT_PROTECTED_ACADEMY_IDS=${{ vars.FLAG_CONTENT_PROTECTED_ACADEMY_IDS }}
            FLAG_VIDEO_NORMAL_MODE=${{ vars.FLAG_VIDEO_NORMAL_MODE }}
            FLAG_VIDEO_NORMAL_ACADEMY_IDS=${{ vars.FLAG_VIDEO_NORMAL_ACADEMY_IDS }}
            FLAG_VIDEO_PREMIUM_MODE=${{ vars.FLAG_VIDEO_PREMIUM_MODE }}
            FLAG_VIDEO_PREMIUM_ACADEMY_IDS=${{ vars.FLAG_VIDEO_PREMIUM_ACADEMY_IDS }}
            # P64 Communications C4/C5/C6. These were absent from this
            # list, so the host could never receive them at ALL — the
            # features were off by construction rather than by choice, and
            # setting the repository variable would have changed nothing.
            FLAG_AUTH_EMAIL_OTP_MODE_MANAGEMENT=${{ vars.FLAG_AUTH_EMAIL_OTP_MODE_MANAGEMENT }}
            FLAG_AUTH_EMAIL_OTP_MODE_ACADEMY=${{ vars.FLAG_AUTH_EMAIL_OTP_MODE_ACADEMY }}
            FLAG_LIFECYCLE_SEQUENCES_MODE=${{ vars.FLAG_LIFECYCLE_SEQUENCES_MODE }}
            FLAG_VIDEO_RETENTION_MODE=${{ vars.FLAG_VIDEO_RETENTION_MODE }}
            FLAG_MEDIA_ARCHIVE_PURGE_MODE=${{ vars.FLAG_MEDIA_ARCHIVE_PURGE_MODE }}
            FLAG_SIGNUP_ORGANIZATION_MODE=${{ vars.FLAG_SIGNUP_ORGANIZATION_MODE }}
            # Google Identity: off (default) | allowlist | on.
            FLAG_AUTH_GOOGLE_MODE=${{ vars.FLAG_AUTH_GOOGLE_MODE }}
            FLAG_AUTH_GOOGLE_ACADEMY_IDS=${{ vars.FLAG_AUTH_GOOGLE_ACADEMY_IDS }}
            FLAG_AUTH_GOOGLE_PLATFORM=${{ vars.FLAG_AUTH_GOOGLE_PLATFORM || 'on' }}

  # 3. MIGRATION DEPLOYMENT — dispatch only, with the input explicitly set.
  #
  #    Declaring `environment: production-migrations` does two things at
  #    once, and the second is the one that matters: GitHub holds the job
  #    until a required reviewer approves it, AND it is the only way this
  #    job can read that environment's secrets. `MIGRATION_SSH_KEY` is an
  #    ENVIRONMENT secret, so the migration-capable credential is released
  #    by the approval itself. No other job in this workflow — including
  #    the push path above — can obtain it.
  migrate-and-deploy:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - name: Record the approval
        run: |
          echo "Production migrations approved for run ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }} — dispatched by ${{ github.actor }}"

      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-deploy
        with:
          ssh_key: ${{ secrets.MIGRATION_SSH_KEY }}
          user: ${{ secrets.MIGRATION_DEPLOY_USER || secrets.DEPLOY_USER }}
          host: ${{ secrets.DEPLOY_HOST }}
          with_migrations: 'true'
          zoom_client_id: ${{ secrets.ZOOM_OAUTH_CLIENT_ID }}
          zoom_client_secret: ${{ secrets.ZOOM_OAUTH_CLIENT_SECRET }}
          zoom_redirect_uri: ${{ secrets.ZOOM_OAUTH_REDIRECT_URI }}
          zoom_webhook_secret_token: ${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
          # Google Identity — secrets; the mode and academies are the
          # FLAG_AUTH_GOOGLE_* variables below.
          google_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          google_redirect_uri: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          # P64 Communications. The provider CHAIN is a repository
          # VARIABLE (it is configuration, not a secret, and the ability
          # to read it is how an operator sees which providers are live);
          # every credential and the sender identity are SECRETS. A
          # provider named in the chain without its key refuses to boot
          # by design — so add `resend` to EMAIL_PROVIDERS only once
          # RESEND_API_KEY exists.
          email_providers: ${{ vars.EMAIL_PROVIDERS }}
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          email_from_email: ${{ secrets.EMAIL_FROM_EMAIL }}
          email_from_name: ${{ vars.EMAIL_FROM_NAME }}
          email_reply_to: ${{ secrets.EMAIL_REPLY_TO }}
          brevo_webhook_secret: ${{ secrets.BREVO_WEBHOOK_SECRET }}
          resend_webhook_secret: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          alert_slack_webhook_url: ${{ secrets.ALERT_SLACK_WEBHOOK_URL }}
          platform_web_url: ${{ vars.PLATFORM_WEB_URL }}
          # Real-user monitoring is on unless the repository variable says
          # otherwise (set RUM_ENABLED=false to switch it off at the next deploy).
          rum_enabled: ${{ vars.RUM_ENABLED || 'true' }}
          # P64 rollout flags come from repository VARIABLES (Settings →
          # Variables), one per line; unset ones are dropped by the action.
          feature_flags: |
            FLAG_QUIZ_ENGINE_V2_MODE=${{ vars.FLAG_QUIZ_ENGINE_V2_MODE }}
            FLAG_QUIZ_ENGINE_V2_ACADEMY_IDS=${{ vars.FLAG_QUIZ_ENGINE_V2_ACADEMY_IDS }}
            FLAG_QUIZ_INTEGRITY_MODE=${{ vars.FLAG_QUIZ_INTEGRITY_MODE }}
            FLAG_QUIZ_INTEGRITY_ACADEMY_IDS=${{ vars.FLAG_QUIZ_INTEGRITY_ACADEMY_IDS }}
            FLAG_CONTENT_PROTECTED_MODE=${{ vars.FLAG_CONTENT_PROTECTED_MODE }}
            FLAG_CONTENT_PROTECTED_ACADEMY_IDS=${{ vars.FLAG_CONTENT_PROTECTED_ACADEMY_IDS }}
            FLAG_VIDEO_NORMAL_MODE=${{ vars.FLAG_VIDEO_NORMAL_MODE }}
            FLAG_VIDEO_NORMAL_ACADEMY_IDS=${{ vars.FLAG_VIDEO_NORMAL_ACADEMY_IDS }}
            FLAG_VIDEO_PREMIUM_MODE=${{ vars.FLAG_VIDEO_PREMIUM_MODE }}
            FLAG_VIDEO_PREMIUM_ACADEMY_IDS=${{ vars.FLAG_VIDEO_PREMIUM_ACADEMY_IDS }}
            # P64 Communications C4/C5/C6. These were absent from this
            # list, so the host could never receive them at ALL — the
            # features were off by construction rather than by choice, and
            # setting the repository variable would have changed nothing.
            FLAG_AUTH_EMAIL_OTP_MODE_MANAGEMENT=${{ vars.FLAG_AUTH_EMAIL_OTP_MODE_MANAGEMENT }}
            FLAG_AUTH_EMAIL_OTP_MODE_ACADEMY=${{ vars.FLAG_AUTH_EMAIL_OTP_MODE_ACADEMY }}
            FLAG_LIFECYCLE_SEQUENCES_MODE=${{ vars.FLAG_LIFECYCLE_SEQUENCES_MODE }}
            FLAG_VIDEO_RETENTION_MODE=${{ vars.FLAG_VIDEO_RETENTION_MODE }}
            FLAG_MEDIA_ARCHIVE_PURGE_MODE=${{ vars.FLAG_MEDIA_ARCHIVE_PURGE_MODE }}
            FLAG_SIGNUP_ORGANIZATION_MODE=${{ vars.FLAG_SIGNUP_ORGANIZATION_MODE }}
            # Google Identity: off (default) | allowlist | on.
            FLAG_AUTH_GOOGLE_MODE=${{ vars.FLAG_AUTH_GOOGLE_MODE }}
            FLAG_AUTH_GOOGLE_ACADEMY_IDS=${{ vars.FLAG_AUTH_GOOGLE_ACADEMY_IDS }}
            FLAG_AUTH_GOOGLE_PLATFORM=${{ vars.FLAG_AUTH_GOOGLE_PLATFORM || 'on' }}

name: Deploy

# Phase 7. Builds the production image for linux/arm64 (the Oracle VPS is
# an Ampere/ARM instance — cross-built via QEMU since GitHub's runners
# are x86_64), pushes it to GHCR, then SSHes into the VPS as the
# restricted `deploy` user (never a personal key, never root) to pull
# and roll out.
#
# Triggers directly on push to `main`, NOT gated on `ci.yml` succeeding.
# `ci.yml`'s Lint step has been failing on `main` since before Phase 7
# (624 pre-existing prettier violations across test files, confirmed via
# `git stash` against unmodified `main` — unrelated to this phase, out of
# scope to mass-reformat here). Gating deploy on that CI run would mean
# deploy never fires at all today. Flagged separately for the repo owner
# to fix (either `prettier --write` + commit, or scope the lint script
# away from `test/`) — once fixed, switch this back to
# `workflow_run: {workflows: [CI], types: [completed]}` with
# `if: github.event.workflow_run.conclusion == 'success'` so deploy is
# properly gated on tests passing again.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/atlas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'bash /opt/atlas/deploy.sh'

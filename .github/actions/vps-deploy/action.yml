name: Deploy to the Atlas VPS
description: >-
  SSH to the production VPS and run deploy.sh. Factored out of the Deploy
  workflow so the NORMAL deployment job and the MIGRATION deployment job
  can run identical steps while holding DIFFERENT SSH identities — the
  point of the split is that only one of them is ever given a credential
  capable of migrating, and duplicating this block in both jobs would
  invite the two copies to drift apart.

  This action references no secret of its own. Every credential arrives as
  an input, so the question "which job can migrate?" is answered entirely
  at the two call sites in the workflow.

inputs:
  ssh_key:
    description: Private key for the identity this job is allowed to use.
    required: true
  user:
    description: SSH user on the VPS.
    required: true
  host:
    description: VPS hostname.
    required: true
  with_migrations:
    description: >-
      'true' only from the migration-approved job. Adds --with-migrations,
      which is the sole way deploy.sh will apply a pending migration.
    required: false
    default: 'false'
  zoom_client_id:
    required: false
    default: ''
    description: Zoom OAuth client id, synced into the VPS .env.
  zoom_client_secret:
    required: false
    default: ''
    description: Zoom OAuth client secret, synced into the VPS .env.
  zoom_redirect_uri:
    required: false
    default: ''
    description: Zoom OAuth redirect URI, synced into the VPS .env.
  feature_flags:
    description: >-
      P64 Phase 3 rollout — newline-separated FLAG_*=value lines, sourced from
      GitHub repository VARIABLES by the workflow (never secrets). Only keys
      starting with FLAG_ are accepted and empty values are dropped, so an
      unset variable can never blank a working flag. Reuses the one
      authorised env-sync path (`deploy.sh --sync-env`), so a rollout is a
      variable change plus a deploy — audited in both places — and nothing is
      hand-edited on the VPS.
    required: false
    default: ''
  email_providers:
    required: false
    default: ''
    description: >-
      Comma-separated provider chain in FALLBACK ORDER (`brevo,resend`).
      A provider listed here without its key and `email_from_email`
      REFUSES TO BOOT by design — production must fail honestly rather
      than fall back to the stub and silently send nothing. Leave a
      provider out until its credentials exist.
  brevo_api_key:
    required: false
    default: ''
    description: Brevo API key (primary provider), synced into the VPS .env.
  resend_api_key:
    required: false
    default: ''
    description: Resend API key (fallback provider), synced into the VPS .env.
  email_from_email:
    required: false
    default: ''
    description: >-
      Verified sender identity, the same address on every provider.
      Treated as a secret so it never reaches a build log.
  email_from_name:
    required: false
    default: ''
    description: Sender display name, also the platform name in email branding.
  email_reply_to:
    required: false
    default: ''
    description: Optional Reply-To address.
  brevo_webhook_secret:
    required: false
    default: ''
    description: >-
      Shared secret in the Brevo delivery-webhook URL (Brevo has no HMAC).
      Unset means that endpoint refuses everything — fail closed.
  resend_webhook_secret:
    required: false
    default: ''
    description: Resend (Svix) webhook signing secret. Unset = fail closed.
  platform_web_url:
    required: false
    default: ''
    description: >-
      Public origin used to build links inside emails. Required in
      production once a real provider is configured, otherwise a link in
      a real inbox would point at a localhost default.
  zoom_webhook_secret_token:
    required: false
    default: ''
    description: Zoom webhook secret token, synced into the VPS .env.

runs:
  using: composite
  steps:
    - name: Deploy to VPS
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_HOST: ${{ inputs.host }}
        WITH_MIGRATIONS: ${{ inputs.with_migrations }}
        ZOOM_OAUTH_CLIENT_ID: ${{ inputs.zoom_client_id }}
        ZOOM_OAUTH_CLIENT_SECRET: ${{ inputs.zoom_client_secret }}
        ZOOM_OAUTH_REDIRECT_URI: ${{ inputs.zoom_redirect_uri }}
        ZOOM_WEBHOOK_SECRET_TOKEN: ${{ inputs.zoom_webhook_secret_token }}
        EMAIL_PROVIDERS: ${{ inputs.email_providers }}
        BREVO_API_KEY: ${{ inputs.brevo_api_key }}
        RESEND_API_KEY: ${{ inputs.resend_api_key }}
        EMAIL_FROM_EMAIL: ${{ inputs.email_from_email }}
        EMAIL_FROM_NAME: ${{ inputs.email_from_name }}
        EMAIL_REPLY_TO: ${{ inputs.email_reply_to }}
        BREVO_WEBHOOK_SECRET: ${{ inputs.brevo_webhook_secret }}
        RESEND_WEBHOOK_SECRET: ${{ inputs.resend_webhook_secret }}
        PLATFORM_WEB_URL: ${{ inputs.platform_web_url }}
        FEATURE_FLAGS: ${{ inputs.feature_flags }}
      run: |
        set -euo pipefail

        if [ -z "${SSH_KEY}" ]; then
          echo "No SSH key was supplied to this job. If this is the migration" >&2
          echo "job, the production-migrations environment is missing its" >&2
          echo "MIGRATION_SSH_KEY secret. Refusing to continue." >&2
          exit 1
        fi

        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        # Build a base64 fragment of ONLY the non-empty Zoom vars. Kept in a
        # variable and piped over ssh stdin — never on the command line
        # (which would show in the VPS process list) and never echoed
        # (base64 of a secret is not auto-masked by Actions).
        FRAGMENT_B64=$(python3 - <<'PYEOF'
        import os, base64
        keys = [
          'ZOOM_OAUTH_CLIENT_ID', 'ZOOM_OAUTH_CLIENT_SECRET',
          'ZOOM_OAUTH_REDIRECT_URI', 'ZOOM_WEBHOOK_SECRET_TOKEN',
          # P64 Communications. An EMPTY value is DROPPED, not written as
          # an empty string: the upsert only touches keys present in the
          # fragment, so a provider whose credentials do not exist yet
          # simply leaves .env alone instead of blanking a live value.
          'EMAIL_PROVIDERS', 'BREVO_API_KEY', 'RESEND_API_KEY',
          'EMAIL_FROM_EMAIL', 'EMAIL_FROM_NAME', 'EMAIL_REPLY_TO',
          'BREVO_WEBHOOK_SECRET', 'RESEND_WEBHOOK_SECRET',
          'PLATFORM_WEB_URL',
        ]
        lines = [f"{k}={os.environ[k]}" for k in keys if os.environ.get(k)]
        # P64 feature flags: FLAG_* keys only; values limited to what a mode
        # or a comma-separated list of academy ids can contain.
        import re
        for raw in os.environ.get('FEATURE_FLAGS', '').splitlines():
            raw = raw.strip()
            if not raw or '=' not in raw:
                continue
            k, v = raw.split('=', 1)
            k, v = k.strip(), v.strip()
            if re.fullmatch(r'FLAG_[A-Z0-9_]+', k) and v and re.fullmatch(r'[A-Za-z0-9_,-]+', v):
                lines.append(f"{k}={v}")
        print(base64.b64encode("\n".join(lines).encode()).decode() if lines else "")
        PYEOF
        )

        # Deliver the repo's deploy.sh to the VPS so the deploy SCRIPT is
        # version-controlled too — previously /opt/atlas/deploy.sh was
        # hand-placed and drifted from the repo, so changes to
        # deploy/deploy.sh never took effect in production.
        # P63g — the compose file and the backup script are deployed
        # artefacts too (previously only deploy.sh was, so a change to
        # either in this repo never reached production).
        scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
          deploy/deploy.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/atlas/deploy.sh"
        scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
          deploy/docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/atlas/docker-compose.yml"
        scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
          deploy/backup.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/atlas/backup.sh"
        # Alert routing — monitoring configs (no secrets in them; the secret
        # files are written on the host by deploy.sh from /opt/atlas/.env).
        ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
          "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/atlas/monitoring"
        scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
          ops/monitoring/prometheus.yml ops/monitoring/alertmanager.yml \
          ops/alerts/atlas-prometheus-rules.yml \
          "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/atlas/monitoring/"

        MIGRATE_FLAG=""
        if [ "${WITH_MIGRATIONS}" = "true" ]; then
          MIGRATE_FLAG=" --with-migrations"
        fi

        printf '%s' "$FRAGMENT_B64" | ssh -o StrictHostKeyChecking=accept-new \
          -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
          "bash /opt/atlas/deploy.sh --sync-env${MIGRATE_FLAG}"
